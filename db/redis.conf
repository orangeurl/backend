# Redis Configuration for OrangeURL

# Bind to all interfaces (Docker network)
bind 0.0.0.0

# Port
port 6379

# Enable password authentication
# This will be overridden by REDIS_PASSWORD environment variable
requirepass CHANGE_ME_IN_PRODUCTION

# Disable protected mode when using password
protected-mode yes

# Max memory policy
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# AOF persistence
appendonly yes
appendfsync everysec

# Logging
loglevel notice

# Security: Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""
