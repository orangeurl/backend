services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    restart: unless-stopped

  api:
    environment:
      - APP_PORT=:3000
      - PUBLIC_HOST=api.orangeurl.live
      - DOMAIN=https://orangeurl.live
      - API_QUOTA=10
      - DB_ADDR=db:6379
      - DB_PASS=
      - POSTGRES_URL=postgres://orangeurl:orangeurl123@postgres:5432/orangeurl?sslmode=disable
      - DATABASE_URL=postgres://orangeurl:orangeurl123@postgres:5432/orangeurl?sslmode=disable
    build: api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      db:
        condition: service_started
    restart: unless-stopped

  db:
    build: db
    ports:
      - "6379:6379"
    volumes:
      - ./data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: orangeurl_postgres
    environment:
      POSTGRES_USER: orangeurl
      POSTGRES_PASSWORD: orangeurl123
      POSTGRES_DB: orangeurl
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orangeurl"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
 
